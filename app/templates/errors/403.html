{% extends 'base.html' %}
{% block title %}403 - Access Forbidden{% endblock %}
{% block content %}
<div class="text-center py-5">
    <div class="display-1 fw-bold text-danger mb-2"><i class="bi bi-shield-x"></i> 403</div>
    <h3 class="fw-bold text-dark">Access Denied</h3>
    <p class="text-secondary">Access denied: Your assigned rank/role does not hold clearance to access or perform actions in this department.</p>
    <a href="{{ url_for('main.dashboard') }}" class="btn btn-primary mt-3">
        <i class="bi bi-arrow-left me-1"></i> Return to Dashboard
    </a>
</div>
{% endblock %}
